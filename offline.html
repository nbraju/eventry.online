<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Eventry — You're Offline</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f8f7ff;color:#1f1637;min-height:100vh;display:grid;place-items:center;padding:24px}
main{max-width:520px;background:#fff;border-radius:24px;padding:36px;text-align:center;box-shadow:0 16px 50px rgba(50,20,100,.12)}
.logo{font-size:2rem;font-weight:800;color:#7c3aed;margin-bottom:8px}
button{border:0;background:#7c3aed;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;cursor:pointer}
p{line-height:1.6;color:#625b70}
</style>
</head>
<body>
<main>
<div class="logo">Eventry</div>
<h1>You're offline</h1>
<p>Your internet connection is unavailable. Please reconnect and try again. Previously cached parts of Eventry may still be available.</p>
<button onclick="location.reload()">Try Again</button>
</main>
</body>
</html>
